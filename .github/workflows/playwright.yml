name: Playwright

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: [18]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run tests
        run: npm test

      - name: Job summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### Flaky tests (passed on retry)"
            if [ -f test-results/results.json ]; then
              node -e "
                const r = require('./test-results/results.json');
                const flaky = [];
                const skipped = [];
                const walk = (suite) => {
                  for (const spec of suite.specs || []) {
                    for (const t of spec.tests || []) {
                      if (t.status === 'flaky') flaky.push(spec.title);
                      if (t.status === 'skipped') {
                        const ann = (t.annotations || []).find(a => a.type === 'skip' && a.description);
                        const desc = ann ? ann.description : 'skipped';
                        const m = desc.match(/^(CI-LIMIT-\d+):\s*(.*)$/);
                        skipped.push(m ? [spec.title, m[1], m[2]] : [spec.title, '', desc]);
                      }
                    }
                  }
                  for (const s of suite.suites || []) walk(s);
                };
                for (const s of r.suites || []) walk(s);
                console.log(flaky.length ? flaky.map(t => '- ' + t).join('\n') : '_None._');
                console.log('');
                console.log('### Skipped in CI');
                console.log('| Test | CI-LIMIT | Reason |');
                console.log('|---|---|---|');
                if (skipped.length) {
                  for (const [t, id, reason] of skipped) console.log('| ' + t + ' | ' + id + ' | ' + reason + ' |');
                } else {
                  console.log('| _None._ | | |');
                }
              "
            else
              echo "_No results file._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-node${{ matrix.node-version }}
          path: playwright-report/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-results-node${{ matrix.node-version }}
          path: test-results/
          retention-days: 7
